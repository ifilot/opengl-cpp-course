name: linux-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libglew-dev \
            libglfw3-dev \
            libglm-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libxcursor-dev

      - name: Configure and build lessons
        run: |
          set -euo pipefail
          cmake -S . -B build
          cmake --build build -j$(nproc)
